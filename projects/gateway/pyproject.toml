[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-gateway"
version = "0.0.1"
description = "THEMIS front door: the MCP tool server over the matching pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shayan Sooratgar" },
    { name = "Nicolas Peyer" },
    { name = "Gregory Frommelt" },
    { name = "Ilya Kruchenetskiy" },
]
dependencies = [
    # The only workspace edge this distribution has. Settings, and the request and
    # response models the matcher's HTTP API is described in -- shared so both
    # ends are typed without either importing the other.
    "themis-shared",
    # How the matcher is reached, now that it is not imported. themis-matcher used
    # to be here; dropping it is what makes CI's `boundaries` job an enforcement
    # mechanism rather than a formality, since a stray `from themis_matcher
    # import ...` in this package now fails with ModuleNotFoundError.
    "httpx>=0.27",
]

[project.optional-dependencies]
# There is no `embeddings` extra any more. It existed because this process
# embedded the incoming query itself, which meant an always-on gateway pod
# carrying its own 2.27 GB copy of bge-m3 -- against a 4 GiB namespace quota that
# a single matcher pod already all but fills. The matcher embeds the query now.
#
# Floor is 2.0 because the adapter uses the 2.x API: MCPServer, from
# mcp.server.mcpserver, with host and port as run() arguments. 1.x had FastMCP
# at mcp.server.fastmcp and configured the address through mcp.settings, so the
# two majors are not interchangeable and a range spanning both would be a lie.
mcp = ["mcp>=2.0"]

[project.scripts]
themis-gateway-mcp = "themis_gateway.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
themis-shared = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
