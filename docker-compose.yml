# Local mirror of the cluster: the same Postgres extension, the same schema
# step, and the harvester as a one-shot job rather than a long-running process.
#
# A scheduled harvest in the cluster is one container invocation with a --mode
# flag, so reproducing it here is the same invocation:
#
#   docker compose run --rm harvester --mode incremental
#
# For real timing locally the timer belongs to the host, not the app -- see
# docs/deployment.md for the two crontab lines matching the CronJob schedules.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: matchmaker
      POSTGRES_PASSWORD: matchmaker
      POSTGRES_DB: matchmaker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmaker -d matchmaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    build:
      context: .
      dockerfile: projects/zora/Dockerfile
    entrypoint: ["themis-init-db"]
    environment:
      DATABASE_URL: postgresql://matchmaker:matchmaker@postgres:5432/matchmaker
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: it runs, writes, and exits. A schedule is the host's job (or the
  # cluster's), never the application's.
  harvester:
    build:
      context: .
      dockerfile: projects/zora/Dockerfile
    environment:
      MATCHER_BASE_URL: http://matcher-api:8100
      DATABASE_URL: postgresql://matchmaker:matchmaker@postgres:5432/matchmaker
      # Mirrors the cluster: the token arrives as a mounted file. Running
      # the harvester on the host instead accepts ZORA_UZH_API_KEY inline.
      ZORA_UZH_API_KEY_FILE: /run/secrets/zora-token
    volumes:
      - ./token.secret:/run/secrets/zora-token:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["manual"]

  # One-shot, like the harvester: it runs, writes, and exits. This is the COLD
  # build -- the one you run when there is no index yet. In steady state the
  # ingestion jobs refresh the index themselves by POSTing to the running API
  # (/v1/index/publications, /v1/index/postings), so this service is the
  # exception rather than the routine path; see MATCHER_BASE_URL on harvester and
  # scraper above.
  #
  # `docker compose run --rm indexer` indexes the harvested publication table.
  # Pass `--source data/samples` to index the 50 checked-in samples instead (the
  # ./data mount below is what makes that path exist in-container) -- note that
  # overriding `command` replaces the whole list, so spell out
  # `index --source data/samples`.
  #
  # MATCHER_EMBEDDING_MODEL is deliberately NOT set here. The image exists to run
  # the real model, so it inherits themis_matcher/config.py's BAAI/bge-m3
  # default; set MATCHER_EMBEDDING_MODEL=hash-fake on the command line for a fast
  # structural check that skips the 2.27 GB download.
  indexer:
    build:
      context: .
      dockerfile: projects/matcher/Dockerfile
    # Explicit since the image default became `serve`. This service is the cold
    # full build -- the role you want when there is no index yet and starting one
    # over HTTP would mean holding a request open for days. Once an index exists,
    # prefer the REST triggers the ingestion jobs already use:
    #   curl -XPOST http://localhost:8100/v1/index/publications
    command: ["index", "--source", "db"]
    environment:
      DATABASE_URL: postgresql://matchmaker:matchmaker@postgres:5432/matchmaker
    volumes:
      - ./data:/app/data:ro
      # The compose stand-in for the RWX PVC: the model downloads once and
      # survives `--rm`, instead of being re-fetched on every run.
      - hfcache:/var/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["manual"]

  # The matcher's HTTP API: the same image as `indexer`, with the role chosen by
  # `command`. Long-lived, unlike the batch services, but still behind the
  # `manual` profile like `serving` -- `docker compose up` stays infrastructure
  # only, and this pulls 2.27 GB of weights on first run.
  #
  # It holds the model, the database connection and the LLM client. That is the
  # whole point: one process embeds both the corpus and the incoming query, so
  # there is one copy of bge-m3 rather than one per role.
  #
  # The image sets MATCHER_API_HOST=0.0.0.0; binding to themis_matcher/config.py's
  # 127.0.0.1 default would make the port unreachable from outside the container.
  matcher-api:
    build:
      context: .
      dockerfile: projects/matcher/Dockerfile
    # Redundant with the image default, and kept deliberately: this file is read
    # as documentation of what each role runs, and an implicit serve here would
    # make the indexer above look like the odd one out rather than the exception.
    command: ["serve"]
    environment:
      DATABASE_URL: postgresql://matchmaker:matchmaker@postgres:5432/matchmaker
    ports:
      - "8100:8100"
    volumes:
      - ./data:/app/data:ro
      - hfcache:/var/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["manual"]

  # Long-lived, like matcher-api. No hfcache mount and no DATABASE_URL any more:
  # since the HTTP split this process holds no model and opens no database, it
  # only forwards to MATCHER_BASE_URL. That is also what removed its share in the
  # RWX requirement on the cluster storage class.
  #
  # The image already sets GATEWAY_MCP_HOST=0.0.0.0; binding to
  # themis_gateway/config.py's 127.0.0.1 default would make the port unreachable
  # from outside the container.
  serving:
    build:
      context: .
      dockerfile: projects/gateway/Dockerfile
    environment:
      MATCHER_BASE_URL: http://matcher-api:8100
    ports:
      - "8000:8000"
    depends_on:
      matcher-api:
        condition: service_started
    profiles: ["manual"]

  # One-shot, like the harvester. Two invocations rather than one: `fetch` is the
  # stage that talks to uzh.ch and is deliberately polite, `run` only reads the
  # cache, so they are kept separable.
  #
  #   docker compose run --rm scraper fetch --resume
  #   docker compose run --rm scraper run --resume
  #
  # SCRAPER_CONTACT has no default and the scraper refuses to fetch without one:
  # it goes out in the User-Agent so a site owner can reach a human.
  scraper:
    build:
      context: .
      dockerfile: projects/scraper/Dockerfile
    environment:
      MATCHER_BASE_URL: http://matcher-api:8100
      DATABASE_URL: postgresql://matchmaker:matchmaker@postgres:5432/matchmaker
      SCRAPER_CONTACT: ${SCRAPER_CONTACT:-}
      SCRAPER_LLM_API_KEY: ${SCRAPER_LLM_API_KEY:-}
    volumes:
      # The compose stand-in for a PVC: the page cache survives `--rm`, so a rerun
      # does not re-fetch 103 pages.
      - scrapercache:/app/data/scraper/cache
      - scrapervar:/app/data/scraper/var
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["manual"]

  # Don't forget to load the models:
  # docker compose exec ollama ollama pull qwen3:8b
  # docker compose exec ollama ollama pull qwen3-embedding:4b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  # Written by the scraper at runtime; machine output, never the repository's.
  scrapercache:
  scrapervar:
  ollama:
  # Shared by indexer and serving, mirroring the single RWX PVC in the cluster.
  hfcache:
