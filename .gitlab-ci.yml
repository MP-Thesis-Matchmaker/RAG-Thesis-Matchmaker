# Build the four deployable images and push them to the ZI Harbor registry.
#
# This runs on gitlab.uzh.ch, NOT on GitHub. The two remotes carry the same tree
# but different automation: .github/workflows/ci.yml is the correctness gate
# (lint, format, tests, boundaries, wheels) and never builds an image; this file
# builds images and never runs a test. Neither is a substitute for the other, and
# a green pipeline here says nothing about whether the code works -- run
# scripts/check.sh --ci for that.
#
# The registry is reachable from gitlab.uzh.ch runners; see docs/deployment.md.
# GHCR is not policy-compliant for this cluster and a workflow pointing there was
# deleted once already -- do not reintroduce one.

stages:
  - prepare
  - build

variables:
  HARBOR_REGISTRY: registry.cs.zi.uzh.ch
  HARBOR_PROJECT: uzh-dsi-askuzh-masterthesis-supervisor
  # The channel suffix, and the only thing separating these artefacts from a
  # future production set. Everything published by this file is test-channel:
  # <version>-test and latest-test. Production tagging is a separate decision and
  # should arrive as a separate set of rules, not by editing this value.
  IMAGE_CHANNEL: test

# Standard branch/MR de-duplication: one pipeline per change, not two. A merge
# request pipeline leaves CI_COMMIT_BRANCH unset, which is also what makes the
# push guard below correctly refuse to publish from an MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# prepare
# ---------------------------------------------------------------------------

# The image tag is derived from pyproject.toml, never hardcoded here. Bumping
# `version` in a member's manifest is therefore the whole release procedure --
# there is no second place to remember. The repository name comes from the same
# file (project.name, e.g. themis-zora), so the Harbor layout cannot drift from
# the distribution names either.
#
# tomllib rather than sed: a regex over a TOML file is a guess that works until
# someone adds a `version` key to another table. This is a real parse, it fails
# loudly on a missing or empty version, and it prints all four in one place so
# the pipeline log answers "what did this publish?" without opening Harbor.
versions:
  stage: prepare
  image: python:3.12-slim
  interruptible: true
  script:
    - |
      python3 - <<'PY'
      import pathlib, re, sys, tomllib

      PROJECTS = ["zora", "scraper", "matcher", "gateway"]

      # A Docker tag is [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. A PEP 440 version is
      # not a subset of that: a local identifier such as 1.0.0+dirty is perfectly
      # legal in pyproject.toml and illegal as a tag. Checked here, in the job
      # that costs ten seconds, rather than discovered at `docker push` after a
      # forty-minute scraper build. The channel suffix is appended later, so the
      # budget is 128 minus its length.
      TAG = re.compile(r"[a-zA-Z0-9_][a-zA-Z0-9._-]{0,110}$")

      out = pathlib.Path("versions")
      out.mkdir(exist_ok=True)

      problems = []
      for project in PROJECTS:
          manifest = pathlib.Path("projects") / project / "pyproject.toml"
          data = tomllib.loads(manifest.read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = str(data["project"].get("version", "")).strip()
          if not version:
              problems.append(f"{manifest}: no [project].version")
              continue
          if not TAG.fullmatch(version):
              problems.append(f"{manifest}: version {version!r} is not a usable Docker tag")
              continue
          (out / f"{project}.version").write_text(version, encoding="utf-8")
          (out / f"{project}.repository").write_text(name, encoding="utf-8")
          print(f"{project:<9} {name:<16} {version}")

      if problems:
          sys.exit("\n".join(problems))
      PY
  artifacts:
    paths:
      - versions/
    expire_in: 1 day

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------

# One job per deployable role, fanned out from a single definition. The four
# differ only in which Dockerfile they point at -- everything else, including
# which extras get installed, is already decided inside the Dockerfile.
#
# This builds with kaniko. That is forced by the runners rather than chosen on
# the merits, and it is acknowledged technical debt: kaniko was archived upstream
# by Google in 2025 and receives no fixes. Read "Why kaniko" at the bottom of this
# file before changing it -- the two obvious replacements were both tried and both
# fail here for the same reason.
build:
  stage: build
  image:
    # The `-debug` variant, and not by preference: the plain executor image ships
    # no shell, and GitLab runs every `script:` through one. With the non-debug
    # tag the job dies before kaniko is ever reached. `entrypoint: [""]` is the
    # matching half -- the image's entrypoint IS the executor binary, so without
    # this GitLab's generated shell script is passed to kaniko as arguments.
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - versions
  parallel:
    matrix:
      - PROJECT: [zora, scraper, matcher, gateway]
  # Every build here is cold (see the caching note below), so this is no longer
  # comfortable: the matcher pulls a CPU torch build and the scraper installs
  # chromium plus its --with-deps OS libraries. A job killed at exactly 1h hit
  # this, not a hang. Raising it past the project's own "Maximum job timeout"
  # (Settings -> CI/CD -> General pipelines) has no effect: the smaller wins.
  timeout: 1h
  interruptible: true
  # Deliberately NOT retrying stuck_or_timeout_failure any more. It was there
  # when builds were cached and a timeout meant something had genuinely hung;
  # now that every build is cold, a timeout is the expected deterministic outcome
  # of an image that got slower, and retrying it twice burns three hours of
  # shared-runner time to fail anyway. If a job times out, look at the image.
  retry:
    max: 2
    when:
      - runner_system_failure
  before_script:
    - /kaniko/executor version
  script:
    - |
      set -eu

      VERSION="$(cat "versions/${PROJECT}.version")"
      REPOSITORY="$(cat "versions/${PROJECT}.repository")"
      IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${REPOSITORY}"
      VERSION_TAG="${IMAGE}:${VERSION}-${IMAGE_CHANNEL}"
      LATEST_TAG="${IMAGE}:latest-${IMAGE_CHANNEL}"

      echo "building ${PROJECT} -> ${VERSION_TAG}"

      # kaniko builds and pushes in one pass -- there is no separate push step to
      # gate, so the default-branch rule has to be decided here, before the build.
      #
      # Feature branches and merge requests prove the Dockerfile still builds and
      # stop there: the Harbor project has a 10 GB quota shared by every image and
      # no automatic garbage collection, so a superseded latest-test digest keeps
      # consuming quota until a retention policy removes it. CI_COMMIT_BRANCH is
      # unset in a merge request pipeline, so an MR never publishes either.
      if [ "${CI_COMMIT_BRANCH:-}" != "${CI_DEFAULT_BRANCH}" ]; then
          echo "not on ${CI_DEFAULT_BRANCH} -- will build and verify, nothing pushed"
          PUBLISH_ARGS="--no-push"
      else
          # On the default branch a missing credential is a misconfiguration, not
          # a branch that happens to lack a Protected variable. Fail loudly rather
          # than building for forty minutes and quietly publishing nothing.
          if [ -z "${HARBOR_THEMIS_ROBOT_PASSWORD:-}" ]; then
              echo "HARBOR_THEMIS_ROBOT_PASSWORD is unset on ${CI_DEFAULT_BRANCH}." >&2
              echo "If it is marked Protected, ${CI_DEFAULT_BRANCH} must be a protected branch." >&2
              exit 1
          fi

          # Harbor robot account: a plain username/password pair, nothing exotic.
          # HARBOR_THEMIS_ROBOT_USER is the full robot$<project>+<account> string
          # and is not secret; HARBOR_THEMIS_ROBOT_PASSWORD is the generated one.
          #
          # NOTE for whoever maintains those variables: the username contains a
          # `$`, and GitLab expands `$` references inside variable VALUES. The
          # variable must have "Expand variable reference" unticked or it arrives
          # here as "robot" followed by an empty expansion, and the push fails
          # with a 401 that looks like a wrong password.
          #
          # kaniko has no `login` verb; it reads a Docker config file. Written
          # here rather than kept as a CI variable so the secret never exists
          # outside this job's container, and piped so it is never an argv entry.
          mkdir -p /kaniko/.docker
          AUTH="$(printf '%s:%s' "${HARBOR_THEMIS_ROBOT_USER}" \
                                 "${HARBOR_THEMIS_ROBOT_PASSWORD}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "${HARBOR_REGISTRY}" "${AUTH}" \
              > /kaniko/.docker/config.json
          unset AUTH

          # Both tags name the same digest; the second costs no upload.
          PUBLISH_ARGS="--destination ${VERSION_TAG} --destination ${LATEST_TAG}"
      fi

      # No cross-job layer cache, and that is a real cost rather than an
      # oversight worth hiding: every run rebuilds from scratch, so the matcher
      # re-downloads torch each time. kaniko can cache (--cache --cache-repo),
      # but only by pushing every intermediate layer into Harbor, against a 10 GB
      # quota with no garbage collection. Declined rather than half-built. A
      # privileged runner would restore caching and drop kaniko in one move.
      #
      # Build context is the repository ROOT for all four images, with the
      # Dockerfile selected explicitly. Every Dockerfile copies all five members'
      # pyproject.toml so `uv sync --locked` can validate the whole workspace;
      # a project-directory context makes them fail with "the lockfile needs to
      # be updated".
      #
      # Provenance goes on as --label. The tags carry a version, not a SHA, so
      # these labels are the only thing tying a running container back to an
      # exact commit -- docs/deployment.md explains the departure from the
      # SHA-tag scheme it originally specified.
      /kaniko/executor \
          --context "dir://${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/projects/${PROJECT}/Dockerfile" \
          --digest-file /tmp/digest \
          --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
          --label "org.opencontainers.image.version=${VERSION}" \
          --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          ${PUBLISH_ARGS}

      if [ "${PUBLISH_ARGS}" = "--no-push" ]; then
          echo "built and verified ${PROJECT}, nothing pushed"
      else
          echo "pushed ${VERSION_TAG} and ${LATEST_TAG} ($(cat /tmp/digest))"
      fi

# ---------------------------------------------------------------------------
# Why kaniko, and what it costs
# ---------------------------------------------------------------------------
#
# kaniko is archived upstream. Google stopped maintaining it in 2025, so it gets
# no fixes and no new Dockerfile syntax. It is here because it is the only one of
# the three candidates that runs on the runners this project actually has, and it
# should be replaced the moment that stops being true. That is the exit condition:
# a privileged (or seccomp-relaxed) runner, not a newer kaniko.
#
# All three were tested rather than reasoned about. The findings, so nobody
# repeats the afternoon:
#
#   docker-in-docker -- FAILS. Was the original design here; every job failed on
#   2026-08-27 (MR !1). The job log leads with a misleading line:
#
#       Failed to initialize: unable to resolve docker endpoint:
#       open /certs/client/ca.pem: no such file or directory
#
#   That is not a TLS misconfiguration. It is the downstream symptom of the dind
#   service never starting, which the *service* container logs -- printed only
#   because the health check timed out -- state plainly:
#
#       ip: can't find device 'nf_tables'
#       mount: permission denied (are you root?)
#       Could not mount /sys/kernel/security.
#
#   dockerd needs CAP_SYS_ADMIN to program iptables and set up its own mount
#   namespace. gitlab-runner grants that only when `privileged = true` is set in
#   the runner's config.toml.
#
#   buildah -- ALSO FAILS, and for a reason worth writing down, because it is the
#   fallback this file used to recommend. It dies before it builds anything:
#
#       Error during unshare(CLONE_NEWUSER): Operation not permitted
#
#   Under Docker's default capability set even uid 0 lacks CAP_SYS_ADMIN, so
#   buildah tries to acquire it by entering a user namespace -- and Docker's
#   default seccomp profile blocks CLONE_NEWUSER for exactly those containers.
#   Neither STORAGE_DRIVER=vfs nor BUILDAH_ISOLATION=chroot avoids it; both apply
#   after that point. Reproduce in ten seconds on any machine with Docker:
#
#       docker run --rm quay.io/buildah/stable:v1.43.2 buildah info   # fails
#       docker run --rm --security-opt seccomp=unconfined \
#           quay.io/buildah/stable:v1.43.2 buildah info               # works
#
#   So buildah needs `security_opt` or `cap_add` in the runner's config.toml --
#   the same class of change as dind's `privileged`, which is what makes it a
#   non-fallback here rather than a lesser one.
#
#   kaniko -- WORKS. It never shells out to a container runtime: it unpacks each
#   layer into its own filesystem and snapshots the result, so it needs no user
#   namespace, no privileged mode and no seccomp exemption. Verified unprivileged
#   under the default seccomp profile against projects/zora/Dockerfile, including
#   a real `uv sync --locked` and the correct ENTRYPOINT/CMD on the result.
#
# Two consequences of kaniko that are easy to trip over later:
#
#   - It reads ONLY the root .dockerignore. The per-Dockerfile
#     projects/<member>/Dockerfile.dockerignore files are a BuildKit convention
#     and are ignored entirely here. The root .dockerignore exists for exactly
#     this case and is a superset that is safe for all four images -- so CI and a
#     local `docker build` filter the context differently.
#   - It supports no BuildKit-only Dockerfile syntax: no `RUN --mount=type=cache`,
#     no heredocs, no `# syntax=` directives. None of the four Dockerfiles use any
#     today. Adding one would break CI while still building fine locally.
