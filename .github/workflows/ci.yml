name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dependencies come from uv.lock, never from a fresh resolution. `uv sync
# --locked` fails when pyproject.toml and uv.lock disagree, which turns "edited
# a dependency and forgot to re-lock" into a red build on the PR that caused it
# instead of a silent difference between CI and everyone's laptop. Before this,
# CI installed the project with pip straight from the version ranges in
# pyproject.toml, and a ruff release nobody asked for failed a branch that
# touched no Python at all.
#
# uv's own version is pinned for the same reason: it is the tool that reads the
# lock. The pins below are deliberately literal rather than a shared `env` value
# -- a workflow expression is the one thing here that cannot be tested before
# pushing, so keep the two copies in sync by hand.
#
# setup-uv is pinned by commit SHA, not by tag. Partly because it has no moving
# major tag above v7, so `@v10` does not resolve at all -- only `v10.0.1` exists
# -- and partly because a tag is mutable while this action runs with the
# workflow's token. The trailing comment is the only thing making the SHA
# readable, so update both together.

jobs:
  # The whole suite with no server and no network. This is the property worth
  # protecting: the offline implementations (HashEmbedder, InMemoryVectorStore,
  # FakeRetriever, RuleBasedExtractor, TemplateSynthesizer) are real, so the
  # pipeline runs end to end without a model download or a database. If this job
  # ever needs a service to pass, one of them has stopped carrying its weight.
  #
  # Since 2026-08-27 this includes the scraper's ~155 tests, which used to be
  # skipped here by projects/scraper/tests/conftest.py because their imports lived
  # behind an extra. They replay frozen page snapshots, so they need no network and
  # the property above still holds -- but the job is doing more than its name once
  # implied.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          python-version: "3.11"
          # Keyed on uv.lock, so the cache invalidates exactly when the
          # dependency set does.
          enable-cache: true
      # --all-packages because the root is virtual: there is no project for a
      # bare `uv sync` to install. The dev group is a default group, so this is
      # the whole dev environment. The mcp, embeddings and render extras are not
      # requested and so are not installed -- that is the seam this job exists to
      # keep honest. (`scraping` was a fourth until 2026-08-27, when it became
      # ordinary dependencies of themis-scraper; see that member's pyproject.)
      - name: Install
        run: uv sync --locked --all-packages
      # --no-sync: the environment was just built from the lock; re-checking it
      # per step buys nothing and would let a step quietly change it.
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest

  # The same store contract against real pgvector: real SQL, real HNSW, real
  # jsonb containment. Skipped locally when DATABASE_URL is unset.
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matchmaker
          POSTGRES_PASSWORD: matchmaker
          # _test suffix on purpose: the pgvector fixtures are destructive and
          # refuse to run against a database not named that way.
          POSTGRES_DB: matchmaker_test
        options: >-
          --health-cmd "pg_isready -U matchmaker -d matchmaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://matchmaker:matchmaker@localhost:5432/matchmaker_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          python-version: "3.11"
          enable-cache: true
      # --all-packages is required here, not just convenient:
      # tests/integration asserts a contract spanning shared, zora, scraper and
      # the matcher at once.
      - name: Install
        run: uv sync --locked --all-packages
      - name: Create schema
        run: uv run --no-sync themis-init-db
      - name: Test
        run: uv run --no-sync pytest

  # The job that makes the split real rather than aspirational.
  #
  # Every other job installs enough to hide a boundary violation: add
  # `from themis_zora import ...` to a matcher module and `offline` still passes,
  # because --all-packages installed zora anyway. Here each member is installed
  # alone, so the same line fails with ModuleNotFoundError before any test runs.
  #
  # A uv workspace has one virtual environment, so --package does not build a
  # second one -- it replaces the root .venv with just that member's closure.
  # What this proves is therefore the dependency graph, not process isolation,
  # which is exactly the property the four seams are supposed to have.
  #
  # No extras anywhere: the offline implementations are real, so every member's
  # tests run without a model download, and the gateway's tests never import mcp.
  #
  # The scraper leg is why this matrix has five entries rather than four. Its
  # dependencies were an extra named `scraping` until 2026-08-27, so no job ever
  # installed the scraper the way `uv sync --package themis-scraper` does -- and
  # that configuration was broken: bs4 is a module-level import, so the console
  # script died on `--help`. This leg is the one that would have caught it, which
  # is also why its import check names a real module rather than the package
  # (themis_scraper/__init__.py imports nothing, so `import themis_scraper` proves
  # nothing). The same hole once let `mcp>=1.2` resolve to 2.0.0, remove FastMCP
  # and break the MCP adapter entirely -- found only when an image was built by
  # hand. An uninstalled extra is a configuration nobody tests.
  boundaries:
    runs-on: ubuntu-latest
    strategy:
      # One red member should not hide the others.
      fail-fast: false
      matrix:
        # `import` is spelled out per leg rather than derived from `member`: for
        # the scraper the package __init__ is a docstring with no imports, so the
        # bare package import would pass while the CLI was unusable.
        include:
          - member: shared
            package: themis-shared
            import: themis_shared
            tests: libs/shared/tests
          - member: matcher
            package: themis-matcher
            import: themis_matcher
            tests: projects/matcher/tests
          - member: gateway
            package: themis-gateway
            import: themis_gateway
            tests: projects/gateway/tests
          - member: zora
            package: themis-zora
            import: themis_zora
            tests: projects/zora/tests
          - member: scraper
            package: themis-scraper
            import: themis_scraper.main
            tests: projects/scraper/tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          python-version: "3.11"
          enable-cache: true
      - name: Install ${{ matrix.package }} alone
        run: uv sync --locked --package ${{ matrix.package }}
      # Separate from the tests: an import error here means the package cannot be
      # installed on its own at all, which is a different failure from a test
      # that needs something the package does not declare.
      - name: Import ${{ matrix.import }}
        run: uv run --no-sync python -c "import ${{ matrix.import }}"
      - name: Test
        run: uv run --no-sync pytest ${{ matrix.tests }}

  # schema.sql is package data, and that is only provable against a built wheel.
  # An editable install resolves it through the source tree whether or not
  # [tool.setuptools.package-data] names it, so every test can pass while the
  # container image is broken -- and the first place that surfaces is the
  # cluster's init-db Job.
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          python-version: "3.11"
          enable-cache: true
      - name: Build every member
        run: uv build --all-packages
      - name: schema.sql must be inside the wheel
        run: |
          python -m zipfile -l dist/themis_shared-*-py3-none-any.whl \
            | grep -q 'themis_shared/schema.sql'
      # --isolated --no-project: no source tree on the path, so this reads the
      # wheel or it fails.
      - name: schema.sql must resolve from the installed wheel
        run: |
          uv run --isolated --no-project --with dist/themis_shared-*-py3-none-any.whl \
            python -c "
          from importlib import resources
          sql = resources.files('themis_shared').joinpath('schema.sql').read_text(encoding='utf-8')
          assert 'create table' in sql.lower(), 'schema.sql is present but not readable as DDL'
          print(f'ok: {len(sql)} chars')
          "
