# Workspace root. Deliberately no [project] table: there is no `themis`
# distribution, and a virtual root cannot be installed by accident.
#
# Consequence worth knowing before you type it: bare `uv sync` is no longer the
# whole dev setup. Use `uv sync --all-packages --all-extras` for everything, or
# `uv sync --package themis-<member>` to install one member's closure alone --
# which replaces the contents of the single root .venv rather than making a
# second one. A workspace has exactly one virtual environment.
[tool.uv.workspace]
members = ["projects/*", "libs/*"]

# Test tooling is not an optional feature of any distribution -- nobody
# installing themis-shared wants our test runner -- so it is a PEP 735
# dependency group rather than an extra. Each member repeats pytest in its own
# group so that `uv sync --package themis-X` yields an environment its tests can
# actually run in; ruff is only here, because linting is a whole-repository
# operation run once from the root.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# The deployment target is a CPU-only Kubernetes namespace: the ZI general Helm
# chart exposes no GPU, nodeSelector or tolerations key at all, so nothing we
# deploy can ever be scheduled onto an accelerator. PyPI's default linux torch
# wheel is the CUDA build regardless -- a wheel tag cannot say "linux, but no
# accelerator" -- which drags in ~1.55 GB of nvidia-* and triton that runs
# nothing faster, because CUDA wheels are a capability rather than a speedup.
# Three separate reasons to drop them: the Harbor project quota is 10 GB by
# default, the container Compliance Policy asks images to carry "nur die absolut
# notwendigen Komponenten", and pulling them on every scheduled indexer run
# costs bandwidth for nothing. See docs/deployment.md.
#
# The marker is what keeps this from hurting local development: macOS never
# matches sys_platform == 'linux', so Apple Silicon still resolves the stock
# universal wheel, and MPS keeps working -- MPS ships inside that wheel, there is
# no separate build to opt into.
#
# Both blocks MUST live at the workspace root. uv reads index *settings* from the
# root only and warns-and-ignores a [[tool.uv.index]] in a member, which would
# leave the source override below pointing at an index that does not exist.
# tool.uv.sources, by contrast, is metadata and is inherited by every member --
# verified on uv 0.11.17: with torch named only in themis-matcher and this block
# only here, the lock carries 2.12.1+cpu from download.pytorch.org under
# sys_platform == 'linux', stock 2.12.1 from PyPI elsewhere, and zero nvidia-*.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit: this index is used ONLY by packages that name it below, never as a
# general fallback for anything else in the lock.
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# Ruff config lives here and only here. Ruff treats a pyproject.toml as a config
# file only if it contains a [tool.ruff] table, so with none in the members it
# walks up to this one from every file -- one configuration, no drift.
[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "libs/shared/src",
    "projects/matcher/src",
    "projects/gateway/src",
    "projects/zora/src",
    "projects/scraper/src",
    # The two test-support directories, for the same reason pytest's pythonpath
    # lists them: fake_dso and replay_util are imported by bare name, and
    # without this isort files them under third-party next to pytest.
    "projects/zora/tests",
    "projects/scraper/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Naming the packages is sturdier than relying on src alone to infer them.
known-first-party = [
    "themis_shared",
    "themis_matcher",
    "themis_gateway",
    "themis_zora",
    "themis_scraper",
]

# Pytest config lives here and only here, which fixes rootdir at the repository
# root. Three things depend on that: the root conftest.py is loaded for every
# member's tests, `sources_path = "data/samples"` and
# `data_root = Path("data/scraper")` are CWD-relative and keep resolving, and
# `pytest projects/scraper/tests` works from the root. Always invoke pytest from
# the repository root -- `cd projects/zora && pytest` sees none of this.
[tool.pytest.ini_options]
testpaths = [
    "tests/integration",
    "libs/shared/tests",
    "projects/matcher/tests",
    "projects/gateway/tests",
    "projects/zora/tests",
    "projects/scraper/tests",
]
addopts = "-q"
pythonpath = ["projects/zora/tests", "projects/scraper/tests"]
